openapi: 3.0.3
info:
  title: Admin Portal Actions API
  version: 0.1.0
  description: OpenAPI draft for action execution endpoints (sync & async patterns)
servers:
  - url: https://api.example.local
paths:
  /actions/{actionId}/run:
    post:
      summary: Run an operational action (sync or async)
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Action completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '202':
          description: Action accepted for async processing
          headers:
            Location:
              description: URL to poll job status
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too many requests

  /jobs/{jobId}:
    get:
      summary: Get status of an async job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

components:
  schemas:
    ActionRequest:
      type: object
      properties:
        tenantId:
          type: string
        subscriptionId:
          type: string
        resourceId:
          type: string
        parameters:
          type: object
      required: [tenantId, subscriptionId, resourceId]

    ActionResult:
      type: object
      properties:
        status:
          type: string
        result:
          type: object

    AcceptedResponse:
      type: object
      properties:
        job_id:
          type: string
        status_url:
          type: string

    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        progress:
          type: integer
          format: int32
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        audit:
          type: object
          properties:
            initiated_by:
              type: string
            initiated_at:
              type: string
              format: date-time
            correlation_id:
              type: string
