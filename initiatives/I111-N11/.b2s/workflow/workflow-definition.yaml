version: 1
framework: b2s
description: >
  Agile delivery light flow: lean progressive decomposition with
  architecture-awareness. Epic-centric output — one folder per epic
  containing epic overview and lean user stories with embedded BDD.
  Planning and epic elaboration are the default output. Implementation
  contracts and coding handoff are generated later on demand.

constraints:
  single_active_action: true
  max_active_actions: 1
  state_files_orchestrator_only: true

stages:
  - id: "0-governance"
    name: "Governance"
    description: "Create the delivery constitution that governs all later phases."
    execution_mode: serial
    actions:
      - create-delivery-constitution
    next_stages:
      - id: "1-requirements-and-architecture"
        condition: always

  - id: "1-requirements-and-architecture"
    name: "Requirements and architecture"
    description: "Extract atomic requirements, review architecture, and create architecture rules in a single gated stage."
    execution_mode: serial
    actions:
      - create-atomic-requirements
      - review-initial-architecture
      - gate-architecture-review
      - create-architecture-rules
    next_stages:
      - id: "2-delivery-planning"
        condition: gate-architecture-review accepted

  - id: "2-delivery-planning"
    name: "Delivery planning"
    description: "Create delivery skeleton and elaboration plan with Mermaid dependency diagram."
    execution_mode: serial
    actions:
      - create-delivery-skeleton
      - create-elaboration-plan
      - gate-elaboration-plan-review
    next_stages:
      - id: "3-epic-elaboration"
        condition: gate-elaboration-plan-review accepted

  - id: "3-epic-elaboration"
    name: "Epic elaboration"
    description: "Generate epic folders with lean user stories, validate requirement coverage, and review."
    execution_mode: serial
    actions:
      - create-epic-folders
      - validate-fr-coverage
      - gate-epic-review
    next_stages: []

human_triggered_actions:
  - create-brs
  - spec-correction
  - create-epic-implementation-contracts
  - create-epic-coding-handoffs
