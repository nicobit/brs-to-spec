  - question_id: UIQ-002
    route: /api/intake/status
    page: Status Lookup (/applications/status)
    topic: Status lookup parameters and response schema
    answer: |
      Query parameters (required):
        - arn (string)   # required
        - dob (YYYY-MM-DD)   # required

      Success (200 OK):
        {
          "arn": "APP-xxxxxxxxxxxx",
          "status": "submitted|scoring|pending|approved|declined",
          "last_update": "2026-06-28T12:34:56Z",
          "decision_reason": "string (optional)"
        }

      If only ARN is provided without DOB, the API returns 400 Bad Request.

    impact: Required for status page stories and contract tests
