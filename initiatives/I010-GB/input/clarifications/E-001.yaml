answers:
  - question_id: UIQ-001
    route: /api/intake/submit
    page: Application Form (/applications/new)
    topic: Intake API contract
    answer: |
      Request JSON (application/json):
        {
          "full_name": "string",            # required
          "dob": "YYYY-MM-DD",              # required, date
          "ni_number": "string",            # required
          "annual_income": number,            # required
          "loan_amount": number,              # required, 1000..50000
          "repayment_term_months": integer,   # required, 12..84
          "loan_purpose": "string"           # optional, enum
        }

      Success (201 Created):
        {
          "arn": "APP-xxxxxxxxxxxx"
        }

      Error (400 Bad Request):
        {
          "errors": [
            { "field": "loan_amount", "message": "must be between 1000 and 50000" }
          ]
        }

    impact: UI data bindings and story acceptance criteria; required to finalise form contracts
