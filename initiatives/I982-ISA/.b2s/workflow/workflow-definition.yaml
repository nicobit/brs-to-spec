version: 1
framework: b2s
description: >
  Adaptive dynamic workflow for AI-executable spec generation.
  The orchestrator reads all inputs, derives a goal state, and produces
  one targeted artifact per iteration until a developer can implement
  every capability without asking a clarifying question.

constraints:
  single_active_action: true
  max_active_actions: 1
  state_files_orchestrator_only: true

stages:
  - id: "0-dynamic-loop"
    name: "Dynamic orchestration loop"
    description: >
      Iterative: each dispatch-next call runs one orchestration iteration,
      closes one gap, and appends to orchestration/iteration-log.md.
      The loop continues until the iteration log sets continue: false.
    execution_mode: serial
    actions:
      - orchestrate-dynamic-iteration
    next_stages:
      - id: "1-dynamic-closure"
        condition: always

  - id: "1-dynamic-closure"
    name: "Dynamic closure"
    description: >
      Produces the implementation roadmap that sequences coding packages
      for delivery. Runs after the loop declares complete or budget-exceeded.
    execution_mode: serial
    actions:
      - finalize-dynamic-initiative
    next_stages: []

human_triggered_actions:
  - create-brs
  - spec-correction
