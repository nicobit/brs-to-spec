version: 1
framework: b2s
description: >
  Stage action registry for b2s-dynamic v2 — adaptive AI-executable spec loop.
  Two core actions drive the loop; two human-triggered actions are always available.

actions:

  - action_id: orchestrate-dynamic-iteration
    stage_id: "0-dynamic-loop"
    title: "Orchestrate dynamic iteration"
    source_event_template: "EVT-TPL-DYN-010"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/orchestrate-dynamic-iteration.md"
    artifact_template_ref: ".b2s/artifact-templates/dynamic-iteration-log.md"
    inputs:
      required:
        - "input/brs.md"
      optional:
        - "input/architecture.md"
        - "input/loop-steer.md"
        - "orchestration/iteration-log.md"
        - "coding-packages/"
        - "requirements/"
        - "architecture/"
        - "planning/"
        - "quality-gates/"
    outputs:
      primary: "orchestration/iteration-log.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "0-dynamic-loop"

  - action_id: finalize-dynamic-initiative
    stage_id: "1-dynamic-closure"
    title: "Finalize dynamic initiative"
    source_event_template: "EVT-TPL-DYN-011"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/finalize-dynamic-initiative.md"
    artifact_template_ref: null
    inputs:
      required:
        - "orchestration/iteration-log.md"
        - "input/brs.md"
      optional:
        - "input/architecture.md"
        - "coding-packages/"
        - "requirements/"
        - "architecture/"
        - "quality-gates/"
    outputs:
      primary: "orchestration/implementation-roadmap.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "orchestrate-dynamic-iteration"
    conditions: []
    human_gate:
      required: true
      gate_type: review
      gate_message: >
        Review the implementation roadmap before accepting. Confirm all coding
        packages are present and the delivery sequence matches your team's constraints.
    selection_mode: serial
    status_model:
      artifact_on_pass: draft
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "1-dynamic-closure"

  - action_id: create-brs
    stage_id: "human-triggered"
    title: "Create BRS"
    source_event_template: "EVT-TPL-033"
    persona: product-owner
    skill_ref: ".b2s/skills/product-owner/create-brs.md"
    artifact_template_ref: ".b2s/artifact-templates/brs.md"
    inputs:
      required: []
      optional:
        - "input/input-package.md"
    outputs:
      primary: "input/brs.md"
      secondary: []
    must_include: []
    validation_rules: {}
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: draft
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: spec-correction
    stage_id: "human-triggered"
    title: "Spec correction"
    source_event_template: "EVT-TPL-039"
    persona: reviewer
    skill_ref: ".b2s/skills/reviewer/spec-correction.md"
    artifact_template_ref: null
    inputs:
      required: []
      optional: []
    outputs:
      primary: "corrections/"
      secondary: []
    must_include: []
    validation_rules: {}
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: draft
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}
