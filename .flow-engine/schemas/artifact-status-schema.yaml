# ---------------------------------------------------------------------------
# VALID STATUS TRANSITIONS
# ---------------------------------------------------------------------------
#
# missing       → draft          (CREATE_ARTIFACT or UPDATE_ARTIFACT event starts)
# missing       → blocked        (orchestrator detects blocked_by not satisfied)
# draft         → ai_validated   (event validation passes; event does not require human gate)
# draft         → accepted       (event validation passes; event explicitly sets accepted)
# draft         → failed         (event validation fails)
# ai_validated  → accepted       (human approves via WAIT_HUMAN gate resolution)
# ai_validated  → stale          (a dependency artifact is updated after validation)
# accepted      → stale          (a dependency artifact is updated after this was accepted)
# stale         → draft          (UPDATE_ARTIFACT or REPAIR_ARTIFACT event starts)
# stale         → accepted       (re-validation confirms artifact still valid)
# failed        → draft          (REPAIR_ARTIFACT or RETRY_FAILED_TASK event starts)
# blocked       → missing        (blocker resolved — artifact reverts to missing, event unblocked)
#
# Transitions NOT allowed:
# accepted      → missing        (accepted artifacts are never deleted by the engine)
# accepted      → failed         (accepted artifacts are not re-validated unless explicitly repaired)
# ai_validated  → failed         (ai_validated artifacts are not downgraded without a repair event)
#
# BLOCKED_BY CHECK RULE:
# Both ai_validated and accepted satisfy blocked_by checks.
# draft, failed, stale, missing, blocked do NOT satisfy blocked_by checks.
