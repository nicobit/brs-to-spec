version: 1
description: Registry of available workflow types for initiative initialisation.

workflow_types:
  - id: enterprise-modular
    path: ".b2s/workflow-types/enterprise-modular"
    description: "Full staged workflow with business analysis, quality gates, and story packages."
    suitable_for:
      - "Regulated industries"
      - "Multi-team deliveries"
      - "External integrations"
      - "Complex initiatives"
    delivery_modes:
      - OpenSpec
      - Standalone
      - FastPath

  - id: fast-path
    path: ".b2s/workflow-types/fast-path"
    description: "Lightweight workflow for simple or internal initiatives."
    suitable_for:
      - "Internal tools"
      - "Spikes and proof-of-concepts"
      - "Small enhancements"
    delivery_modes:
      - FastPath

  - id: technical-spec-modular
    path: ".b2s/workflow-types/technical-spec-modular"
    description: "Parallel staged workflow prepared for first-class technical specifications and contract-governed handoff."
    suitable_for:
      - "Initiatives requiring canonical technical specifications"
      - "Multi-team deliveries with explicit contract surfaces"
      - "External integrations with deeper design-detail artifacts"
      - "Complex initiatives evolving beyond flat quality-gate contracts"
    delivery_modes:
      - OpenSpec
      - Standalone
      - FastPath

  - id: agile-delivery-flow
    path: ".b2s/workflow-types/agile-delivery-flow"
    description: "Progressive decomposition workflow with architecture-awareness at every phase. Governance-first, domain-driven, with story quality gates and dispatch routing."
    suitable_for:
      - "Architecture-aware progressive delivery"
      - "Domain-driven delivery with capability mapping"
      - "Initiatives requiring per-story quality validation"
      - "AI-agent handoff workflows with dispatch routing"
    delivery_modes:
      - OpenSpec
      - Standalone

  - id: agile-delivery-light-flow
    path: ".b2s/workflow-types/agile-delivery-light-flow"
    description: "Lean progressive decomposition — half the artifacts of agile-delivery-flow. Keeps elaboration planning, story quality gates, BDD scenarios, and OpenSpec/Standalone handoff. Drops domain analysis, architecture impact, test strategy, readiness review, and dispatch."
    suitable_for:
      - "Architecture-aware progressive delivery with minimal overhead"
      - "Initiatives that need story quality gates but not full domain analysis"
      - "Teams that want elaboration planning without capability mapping"
      - "Faster adoption with fewer artifacts while keeping quality gates"
    delivery_modes:
      - OpenSpec
      - Standalone
