    title: "Create delivery constitution"
    source_event_template: "EVT-TPL-100"
    persona: governance-architect
    skill_ref: ".b2s/skills/governance-architect/create-delivery-constitution.md"
    artifact_template_ref: ".b2s/artifact-templates/delivery-constitution.md"
    inputs:
      required:
        - "input/brs.md"
      optional:
        - "input/architecture.md"
        - "input/repository-context.md"
        - "input/input-package.md"
    outputs:
      primary: "governance/delivery-constitution.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "0-governance"

