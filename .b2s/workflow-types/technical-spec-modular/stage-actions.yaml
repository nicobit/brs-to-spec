version: 1
framework: b2s
description: >
  Stage action registry for `.b2s`. Actions replace runtime events and are the
  serial executable units of staged work.

actions:
  - action_id: route-initiative
    stage_id: "0-routing"
    title: "Route initiative"
    source_event_template: "EVT-TPL-001"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/route-initiative.md"
    artifact_template_ref: ".b2s/artifact-templates/routing-decision.md"
    inputs:
      required:
        - "input/brs.md"
      optional:
        - "input/architecture.md"
        - "input/input-package.md"
    outputs:
      primary: "routing/routing-decision.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: accepted
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "0-routing"

  - action_id: create-business-intake-summary
