version: 1
framework: b2s
description: >
  Stage action registry for the b2s-flow workflow type.
  Lean progressive decomposition with mandatory technical landscape analysis
  and solution decisions before backlog generation.

actions:

  # ──────────────────────────────────────────────────────────────────────
  # Stage 0 — Governance
  # ──────────────────────────────────────────────────────────────────────

  - action_id: create-delivery-constitution
    stage_id: "0-governance"
    title: "Create delivery constitution"
    source_event_template: "EVT-TPL-100"
    persona: governance-architect
    skill_ref: ".b2s/skills/governance-architect/create-delivery-constitution.md"
    artifact_template_ref: ".b2s/artifact-templates/delivery-constitution.md"
    inputs:
      required:
        - "input/brs.md"
      optional:
        - "input/architecture.md"
        - "input/repository-context.md"
        - "input/input-package.md"
    outputs:
      primary: "governance/delivery-constitution.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "0-governance"
        delivery_mode: "OpenSpec"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 1 — Requirements and architecture
  # ──────────────────────────────────────────────────────────────────────

  - action_id: create-atomic-requirements
    stage_id: "1-requirements-and-architecture"
    title: "Create atomic requirements"
    source_event_template: "EVT-TPL-101"
    persona: product-owner
    skill_ref: ".b2s/skills/product-owner/create-atomic-requirements.md"
    artifact_template_ref: ".b2s/artifact-templates/atomic-requirements.md"
    inputs:
      required:
        - "input/brs.md"
        - "governance/delivery-constitution.md"
      optional:
        - "input/architecture.md"
        - "input/repository-context.md"
        - "input/input-package.md"
        - "input/brs/*.md"
    outputs:
      primary: "requirements/atomic-requirements.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "requirement_has_id"
        - "source_brs_ids_preserved"
        - "atomic_requirements_derivation_visible"
        - "atomic_requirements_decomposition_traceable"
        - "atomic_requirements_direct_inferred_summary_matches"
      optional:
        - "atomic_requirements_summary_matches_catalog"
    validation_profile: catalog
    artifact_criticality: critical
    blocked_by_stage:
      - "0-governance"
    blocked_by_action:
      - "create-delivery-constitution"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "1-requirements-and-architecture"

  - action_id: review-initial-architecture
    stage_id: "1-requirements-and-architecture"
    title: "Review initial architecture"
    source_event_template: "EVT-TPL-008"
    persona: architect
    skill_ref: ".b2s/skills/architect/review-initial-architecture.md"
    artifact_template_ref: ".b2s/artifact-templates/architecture-review.md"
    inputs:
      required:
        - "requirements/atomic-requirements.md"
        - "governance/delivery-constitution.md"
        - "input/brs.md"
      optional:
        - "input/brs/*.md"
        - "input/architecture.md"
        - "domain/business-rules.md"
    outputs:
      primary: "architecture/architecture-review.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: analytical-review
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action:
      - "create-atomic-requirements"
    conditions: []
    human_gate:
      required: true
      gate_id: "architecture-review"
      owner: "architect"
      artifact_status_on_gate_accept: accepted
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "1-requirements-and-architecture"

  - action_id: gate-architecture-review
    stage_id: "1-requirements-and-architecture"
    title: "Architecture review gate"
    source_event_template: "EVT-TPL-008b"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/gate-architecture-review.md"
    artifact_template_ref: null
    inputs:
      required:
        - "architecture/architecture-review.md"
      optional:
        - "requirements/atomic-requirements.md"
    outputs:
      primary: "architecture/architecture-review.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: analytical-review
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "review-initial-architecture"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: accepted
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: create-architecture-rules
    stage_id: "1-requirements-and-architecture"
    title: "Create architecture rules"
    source_event_template: "EVT-TPL-009"
    persona: architect
    skill_ref: ".b2s/skills/architect/create-architecture-rules.md"
    artifact_template_ref: ".b2s/artifact-templates/architecture-rules.md"
    inputs:
      required:
        - "architecture/architecture-review.md"
        - "input/brs.md"
      optional:
        - "input/brs/*.md"
        - "requirements/atomic-requirements.md"
        - "domain/business-rules.md"
    outputs:
      primary: "architecture/architecture-rules.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: catalog
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action:
      - "gate-architecture-review"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2 — Solution design (NEW)
  # ──────────────────────────────────────────────────────────────────────

  - action_id: analyze-technical-landscape
    stage_id: "2-solution-design"
    title: "Analyze technical landscape"
    source_event_template: "EVT-TPL-200"
    persona: architect
    skill_ref: ".b2s/skills/architect/analyze-technical-landscape.md"
    artifact_template_ref: ".b2s/artifact-templates/technical-landscape.md"
    inputs:
      required:
        - "input/brs.md"
        - "architecture/architecture-review.md"
        - "architecture/architecture-rules.md"
      optional:
        - "input/architecture.md"
        - "input/repository-context.md"
    outputs:
      primary: "architecture/technical-landscape.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "all_components_from_architecture_review_present"
      optional: []
    validation_profile: catalog
    artifact_criticality: critical
    blocked_by_stage:
      - "1-requirements-and-architecture"
    blocked_by_action:
      - "create-architecture-rules"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "2-solution-design"

  - action_id: map-requirements-to-systems
    stage_id: "2-solution-design"
    title: "Map requirements to systems"
    source_event_template: "EVT-TPL-201"
    persona: architect
    skill_ref: ".b2s/skills/architect/map-requirements-to-systems.md"
    artifact_template_ref: ".b2s/artifact-templates/impacted-systems.md"
    inputs:
      required:
        - "architecture/technical-landscape.md"
        - "requirements/atomic-requirements.md"
      optional:
        - "architecture/architecture-review.md"
        - "architecture/architecture-rules.md"
        - "input/brs.md"
    outputs:
      primary: "architecture/impacted-systems.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "all_functional_requirements_mapped"
      optional: []
    validation_profile: catalog
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action:
      - "analyze-technical-landscape"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: create-ui-specification
    stage_id: "2-solution-design"
    title: "Create UI specification"
    source_event_template: "EVT-TPL-204"
    persona: ux-architect
    skill_ref: ".b2s/skills/ux-architect/create-ui-specification.md"
    artifact_template_ref: ".b2s/artifact-templates/ui-specification.md"
    inputs:
      required:
        - "requirements/atomic-requirements.md"
        - "architecture/technical-landscape.md"
        - "architecture/impacted-systems.md"
        - "input/brs.md"
      optional:
        - "architecture/architecture-review.md"
        - "architecture/architecture-rules.md"
        - "input/architecture.md"
    outputs:
      primary: "architecture/ui-specification.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "ui_spec_confirmed_pages_have_page_sections"
        - "ui_spec_confirmed_pages_have_required_subsections"
        - "ui_spec_no_confirmed_when_blockers_exist"
        - "ui_spec_data_binding_contract_mode_present"
        - "ui_spec_every_inferred_has_open_question"
        - "ui_spec_open_questions_have_required_before"
        - "ui_spec_no_encoding_mojibake"
      optional:
        - "ui_spec_shared_components_match_page_fields"
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "map-requirements-to-systems"
    conditions:
      - "architecture/technical-landscape.md contains frontend"
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: create-solution-decisions
    stage_id: "2-solution-design"
    title: "Create solution decisions"
    source_event_template: "EVT-TPL-202"
    persona: architect
    skill_ref: ".b2s/skills/architect/create-solution-decisions.md"
    artifact_template_ref: ".b2s/artifact-templates/solution-decisions.md"
    inputs:
      required:
        - "architecture/impacted-systems.md"
        - "architecture/technical-landscape.md"
        - "architecture/architecture-rules.md"
      optional:
        - "requirements/atomic-requirements.md"
        - "architecture/architecture-review.md"
        - "architecture/ui-specification.md"
        - "input/brs.md"
    computed_inputs:
      - solution_design_clarifications
    outputs:
      primary: "architecture/solution-decisions.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "all_impacted_components_have_decisions"
        - "solution_decisions_traceability_complete"
        - "solution_decisions_inferred_requirements_visible"
      optional: []
    validation_profile: analytical-review
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action:
      - "map-requirements-to-systems"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: resolve-solution-design-open-questions
    stage_id: "2-solution-design"
    title: "Resolve blocking solution design questions"
    source_event_template: "EVT-TPL-202b"
    persona: architect
    skill_ref: ".b2s/skills/architect/resolve-solution-design-open-questions.md"
    artifact_template_ref: ".b2s/artifact-templates/solution-design-clarification-request.md"
    inputs:
      required:
        - "architecture/solution-decisions.md"
        - "architecture/impacted-systems.md"
        - "architecture/technical-landscape.md"
      optional:
        - "architecture/ui-specification.md"
        - "requirements/atomic-requirements.md"
        - "input/brs.md"
    computed_inputs:
      - solution_design_clarifications
    outputs:
      primary: "architecture/solution-design-clarification-request.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "solution_design_clarification_request_has_questions_or_explicit_no_blockers"
        - "solution_design_clarification_request_blocker_taxonomy_complete"
      optional: []
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "create-solution-decisions"
    conditions: []
    human_gate:
      required: true
      gate_id: "solution-design-review"
      owner: "architect"
      interaction_mode: "collect_answers"
      clarification_file: "input/clarifications/solution-design.yaml"
      rerun_action: "create-solution-decisions"
      artifact_status_on_gate_accept: accepted
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: gate-solution-design-review
    stage_id: "2-solution-design"
    title: "Solution design review gate"
    source_event_template: "EVT-TPL-203"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/gate-solution-design-review.md"
    artifact_template_ref: null
    inputs:
      required:
        - "architecture/solution-decisions.md"
      optional:
        - "architecture/impacted-systems.md"
        - "architecture/technical-landscape.md"
    outputs:
      primary: "architecture/solution-decisions.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: analytical-review
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "resolve-solution-design-open-questions"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: accepted
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3 — Delivery planning
  # ──────────────────────────────────────────────────────────────────────

  - action_id: create-delivery-skeleton
    stage_id: "3-delivery-planning"
    title: "Create delivery skeleton"
    source_event_template: "EVT-TPL-118"
    persona: delivery-lead
    skill_ref: ".b2s/skills/delivery-lead/create-delivery-skeleton-light.md"
    artifact_template_ref: ".b2s/artifact-templates/delivery-skeleton-light.md"
    inputs:
      required:
        - "requirements/atomic-requirements.md"
        - "architecture/architecture-review.md"
        - "architecture/solution-decisions.md"
        - "architecture/impacted-systems.md"
        - "governance/delivery-constitution.md"
        - "input/brs.md"
      optional:
        - "input/brs/*.md"
        - "architecture/architecture-rules.md"
    outputs:
      primary: "planning/delivery-skeleton.md"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "all_source_requirements_present"
        - "no_unknown_requirement_references"
        - "delivery_skeleton_requirement_basis_visible"
      optional: []
    validation_profile: structured-document
    artifact_criticality: critical
    blocked_by_stage:
      - "2-solution-design"
    blocked_by_action: []
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "3-delivery-planning"

  - action_id: create-elaboration-plan
    stage_id: "3-delivery-planning"
    title: "Create elaboration plan"
    source_event_template: "EVT-TPL-121"
    persona: delivery-lead
    skill_ref: ".b2s/skills/delivery-lead/create-elaboration-plan.md"
    artifact_template_ref: ".b2s/artifact-templates/elaboration-plan.md"
    inputs:
      required:
        - "planning/delivery-skeleton.md"
        - "architecture/solution-decisions.md"
        - "architecture/impacted-systems.md"
        - "governance/delivery-constitution.md"
      optional:
        - "architecture/architecture-review.md"
        - "architecture/architecture-rules.md"
        - "requirements/atomic-requirements.md"
    outputs:
      primary: "planning/elaboration-plan.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: critical
    blocked_by_stage: []
    blocked_by_action:
      - "create-delivery-skeleton"
    conditions: []
    human_gate:
      required: true
      gate_id: "elaboration-plan-review"
      owner: "delivery-lead"
      artifact_status_on_gate_accept: accepted
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: gate-elaboration-plan-review
    stage_id: "3-delivery-planning"
    title: "Elaboration plan review gate"
    source_event_template: "EVT-TPL-122"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/gate-elaboration-plan-review.md"
    artifact_template_ref: null
    inputs:
      required:
        - "planning/elaboration-plan.md"
      optional:
        - "planning/delivery-skeleton.md"
    outputs:
      primary: "planning/elaboration-plan.md"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "create-elaboration-plan"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: accepted
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  # ──────────────────────────────────────────────────────────────────────
  # Stage 4 — Epic elaboration
  # ──────────────────────────────────────────────────────────────────────

  - action_id: create-epic-shells
    stage_id: "4-epic-elaboration"
    title: "Create epic shells (epic.md + implementation contract)"
    source_event_template: "EVT-TPL-123"
    persona: delivery-lead
    skill_ref: ".b2s/skills/delivery-lead/create-epic-shells.md"
    artifact_template_ref: ".b2s/artifact-templates/epic-folder.md"
    iteration_mode: per_item
    item_source: "planning/delivery-skeleton.md"
    item_pattern: "^###\\s+(E-\\d{3})"
    inputs:
      required:
        - "planning/delivery-skeleton.md"
        - "planning/elaboration-plan.md"
        - "requirements/atomic-requirements.md"
        - "architecture/architecture-review.md"
        - "architecture/architecture-rules.md"
        - "architecture/solution-decisions.md"
        - "architecture/impacted-systems.md"
        - "governance/delivery-constitution.md"
        - "input/brs.md"
      optional:
        - "input/brs/*.md"
        - "input/architecture.md"
        - "input/repository-context.md"
        - "architecture/technical-landscape.md"
        - "architecture/ui-specification.md"
    computed_inputs:
      - epic_context
      - epic_clarifications
    outputs:
      primary: "epics/"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "no_unknown_requirement_references"
        - "requirement_title_consistency"
        - "epic_traceability_basis_visible"
        - "epic_identity_matches_skeleton"
      optional: []
    validation_profile: artifact-package
    artifact_criticality: critical
    blocked_by_stage:
      - "3-delivery-planning"
    blocked_by_action:
      - "gate-elaboration-plan-review"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state:
        current_stage: "4-epic-elaboration"

  - action_id: resolve-epic-open-questions
    stage_id: "4-epic-elaboration"
    title: "Resolve open questions for current epic"
    source_event_template: "EVT-TPL-123c"
    persona: delivery-lead
    skill_ref: ".b2s/skills/delivery-lead/resolve-epic-open-questions.md"
    artifact_template_ref: ".b2s/artifact-templates/epic-clarification-request.md"
    iteration_mode: per_item
    item_source: "planning/delivery-skeleton.md"
    item_pattern: "^###\\s+(E-\\d{3})"
    inputs:
      required:
        - "epics/"
        - "requirements/atomic-requirements.md"
        - "architecture/solution-decisions.md"
      optional:
        - "architecture/ui-specification.md"
        - "input/brs.md"
        - "input/architecture.md"
    computed_inputs:
      - epic_context
      - epic_clarifications
    outputs:
      primary: "epics/"
      secondary: []
    must_include: []
    validation_rules:
      required:
        - "epic_clarification_request_has_questions_or_explicit_no_blockers"
        - "epic_clarification_request_blocker_taxonomy_complete"
      optional: []
    validation_profile: artifact-package
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "create-epic-shells"
    conditions: []
    human_gate:
      required: true
      gate_id: "epic-clarification"
      owner: "delivery-lead"
      interaction_mode: "collect_answers"
      clarification_file: "input/clarifications/{current_item}.yaml"
      rerun_action: "create-epic-shells"
      artifact_status_on_gate_accept: accepted
    selection_mode: serial
    status_model:
      artifact_on_pass: ai_validated
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
      update_state: {}

  - action_id: gate-epic-clarification
    stage_id: "4-epic-elaboration"
    title: "Epic clarification gate"
    source_event_template: "EVT-TPL-123d"
    persona: orchestrator
    skill_ref: ".b2s/skills/orchestrator/gate-epic-clarification.md"
    artifact_template_ref: null
    inputs:
      required:
        - "epics/"
      optional:
        - "input/brs.md"
    outputs:
      primary: "epics/"
      secondary: []
    must_include: []
    validation_rules: {}
    validation_profile: structured-document
    artifact_criticality: high
    blocked_by_stage: []
    blocked_by_action:
      - "resolve-epic-open-questions"
    conditions: []
    human_gate:
      required: false
    selection_mode: serial
    status_model:
      artifact_on_pass: accepted
      artifact_on_gate_accept: accepted
      artifact_on_fail: failed
    on_pass:
