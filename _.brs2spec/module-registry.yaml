version: 1

# module-index.md + module-full.md are the human-readable source of truth for the persona and skill registry.
# module-registry.yaml is the machine-readable companion used only by check_registry.py.
# If they conflict, module-index.md / module-full.md win until this registry is corrected.

personas:

  orchestrator:
    display_name: Orchestrator
    mission: Controls workflow state, detects current phase, selects next persona skill, validates completion, updates workflow-state.json.
    skills:
      run_workflow:
        phase: any
        prompt: brs-to-spec-run-workflow.md
        required_inputs: []
        outputs: [state/workflow-state.json]
        trigger_conditions: ['"continue"', '"what next"', '"run the framework"', '@orchestrator']
        done_criteria: [stage artifact produced, workflow-state.json updated]
      maintain_state:
        phase: after-any-stage
        prompt: skills/3-planning-and-modular-delivery/01-maintain-workflow-state.md
        required_inputs: [state/workflow-state.json]
        outputs: [state/workflow-state.json]
        trigger_conditions: [stage artifact written, stale artifact corrected]
        done_criteria: [current_stage updated, next_action correct]
      maintain_open_decisions:
        phase: any
        prompt: skills/3-planning-and-modular-delivery/00-maintain-open-decisions.md
        required_inputs: []
        optional_inputs: [architecture/architecture-review.md, engineering-readiness/readiness-check.md]
        outputs: [state/open-decisions.md]
        trigger_conditions: [open decisions missing or stale, new decision surfaced, decision resolved]
        done_criteria: [all decisions captured with owners, blocking summary accurate]

  product-owner:
    display_name: Product Owner
    mission: Clarifies business intent, scope, requirements, gaps, and assumptions.
    skills:
      create_brs:
        phase: 0-intake
        prompt: skills/0-intake/00-create-brs.md
        required_inputs: []
        outputs: [input/brs.md]
        trigger_conditions: [BRS missing, user provides notes, '"create a BRS"']
        done_criteria: [structured BRS with objectives and requirements]
      convert_brs_to_markdown:
        phase: 0-input-preparation
        prompt: skills/0-input-preparation/01-convert-brs-word-to-markdown.md
        required_inputs: []
        outputs: [input/brs.md]
        trigger_conditions: [Word or PDF BRS provided]
        done_criteria: [markdown BRS with structure preserved]
      create_business_intake:
        phase: 2-business-intake
        prompt: skills/2-business-intake/01-create-business-intake-summary.md
        required_inputs: [input/brs.md, state/routing-decision.md]
        optional_inputs: [input/architecture.md, input/input-package.md]
        outputs: [business-intake/business-intake-summary.md]
        trigger_conditions: [business-intake/business-intake-summary.md missing or stub]
        done_criteria: [objectives have success measures, every gap has owner]
      find_gaps_and_questions:
        phase: 2-business-intake-advanced
        prompt: skills/2-business-intake/advanced/03-find-gaps-and-questions.md
        required_inputs: [business-intake/business-intake-summary.md, input/brs.md]
        optional_inputs: [input/architecture.md]
        outputs: [business-intake/gaps-and-questions.md]
        trigger_conditions: [business gaps unresolved, gaps-and-questions.md missing after intake]
        done_criteria: [all identified gaps recorded with owners]
      create_business_test_expectations:
        phase: 2-business-intake-advanced
        prompt: skills/2-business-intake/advanced/04-create-business-test-expectations.md
        required_inputs: [business-intake/business-intake-summary.md, input/brs.md]
        optional_inputs: [business-intake/gaps-and-questions.md]
        outputs: [business-intake/business-test-expectations.md]
        trigger_conditions: [business-test-expectations.md missing, QA requests business expectations]
        done_criteria: [test expectations aligned to BRS objectives]

  architect:
    display_name: Architect
    mission: Reviews architecture impact, constraints, governed boundaries, integrations, rollout/rollback rules, and architecture binding rules.
    skills:
      convert_architecture_to_markdown:
        phase: 0-input-preparation
        prompt: skills/0-input-preparation/02-convert-architecture-word-to-markdown.md
        required_inputs: []
        outputs: [input/architecture.md]
        trigger_conditions: [Word or PDF architecture document provided]
        done_criteria: [markdown architecture with components and integrations]
      draft_architecture_from_brs:
        phase: 0-input-preparation-draft
        prompt: skills/0-input-preparation/04-draft-architecture-from-brs.md
        required_inputs: [input/brs.md, business-intake/business-intake-summary.md]
        optional_inputs: [input/input-package.md]
        outputs: [input/architecture.md]
        trigger_conditions: [input/architecture.md missing or stub, business intake exists]
        done_criteria: [draft architecture with DRAFT notice explicit]
      review_initial_architecture:
        phase: 3-planning-architecture
        prompt: skills/3-planning-and-modular-delivery/01-review-initial-architecture.md
        required_inputs: [input/architecture.md, business-intake/business-intake-summary.md, planning/delivery-structure.md]
        optional_inputs: [architecture/existing-system-impact.md]
        outputs: [architecture/architecture-review.md]
        trigger_conditions: [architecture/architecture-review.md missing, delivery structure draft exists]
        done_criteria: [initiative-specific constraints identified, every open decision has owner, Review Decision stated]
      create_architecture_rules:
        phase: 3-planning-architecture
        prompt: skills/3-planning-and-modular-delivery/02-create-global-architecture-rules.md
        required_inputs: [architecture/architecture-review.md, planning/delivery-structure.md]
        optional_inputs: [business-intake/business-intake-summary.md]
        outputs: [architecture/architecture-rules.md]
        trigger_conditions: [architecture/architecture-rules.md missing, architecture review exists]
        done_criteria: [every rule has ID and enforcement, no AR-OPEN-* for resolved decisions]
      review_existing_system_impact:
        phase: 3-planning-architecture-brownfield
        prompt: "skills/3-planning-and-modular-delivery/08-review-existing-system-impact.md"
        required_inputs: [input/architecture.md, business-intake/business-intake-summary.md]
        optional_inputs: [planning/delivery-structure.md]
        outputs: [architecture/existing-system-impact.md]
        trigger_conditions: [brownfield initiative detected, architecture/existing-system-impact.md missing]
        done_criteria: [affected components listed, compatibility and regression risk assessed]

  delivery-lead:
    display_name: Delivery Lead
    mission: Shapes delivery structure — epics, features, user stories, increments, dependencies, and traceability.
    skills:
      create_delivery_structure:
        phase: 3-planning
        prompt: skills/3-planning-and-modular-delivery/03-create-delivery-structure.md
        required_inputs: [business-intake/business-intake-summary.md, state/routing-decision.md]
        optional_inputs: [input/architecture.md, architecture/architecture-review.md]
        outputs: [planning/delivery-structure.md]
        trigger_conditions: [planning/delivery-structure.md missing, business intake exists]
        done_criteria: [epics with IDs and features visible (draft); every feature has well-formed story with AC ref (confirmed)]
      identify_software_modules:
        phase: 3-planning-modular
        prompt: skills/3-planning-and-modular-delivery/04-identify-software-modules.md
        required_inputs: [planning/delivery-structure.md, architecture/architecture-review.md]
        optional_inputs: [input/architecture.md]
        outputs: [planning/software-modules.md]
        trigger_conditions: [modular delivery selected, planning/software-modules.md missing]
        done_criteria: [all software modules identified with scope and capabilities]
      map_capabilities_to_modules:
        phase: 3-planning-modular
        prompt: skills/3-planning-and-modular-delivery/05-map-capabilities-to-modules.md
        required_inputs: [planning/software-modules.md, planning/delivery-structure.md]
        optional_inputs: [architecture/architecture-rules.md]
        outputs: [planning/capability-to-module-map.md]
        trigger_conditions: [planning/capability-to-module-map.md missing, software-modules.md exists]
        done_criteria: [all capabilities mapped to owning modules]
      define_delivery_increments:
        phase: 3-planning-modular
        prompt: skills/3-planning-and-modular-delivery/06-define-delivery-increments.md
        required_inputs: [planning/capability-to-module-map.md, planning/delivery-structure.md]
        optional_inputs: [architecture/architecture-review.md]
        outputs: [planning/delivery-increments.md]
        trigger_conditions: [planning/delivery-increments.md missing, capability map exists]
        done_criteria: [increments defined with scope, dependencies, and sequencing]
      create_traceability_matrix:
        phase: 3-planning
        prompt: skills/3-planning-and-modular-delivery/07-create-traceability-matrix.md
        required_inputs: [planning/delivery-structure.md, business-intake/business-intake-summary.md]
        optional_inputs: [planning/delivery-increments.md, architecture/architecture-rules.md]
        outputs: [planning/traceability-matrix.md]
        trigger_conditions: [traceability matrix missing, delivery structure confirmed]
        done_criteria: [every requirement traced to story, every story traced to requirement]
      create_agile_planning_view:
        phase: 7-perspectives
        prompt: skills/7-perspectives/agile-planning/01-create-gitlab-planning-view.md
        required_inputs: [planning/delivery-structure.md, engineering-readiness/readiness-check.md]
        optional_inputs: [planning/delivery-increments.md, planning/traceability-matrix.md]
        outputs: [perspectives/agile-planning/gitlab-planning-view.md]
        trigger_conditions: [perspectives/agile-planning/gitlab-planning-view.md missing or stale]
        done_criteria: [projection covers all epics, features, and stories]

  qa-analyst:
    display_name: QA Analyst
    mission: Produces BDD scenarios, test strategy, acceptance validation coverage, and regression risk assessment.
    skills:
      create_bdd_scenarios:
        phase: 4-quality-gates
        prompt: skills/4-engineering-readiness/quality-gates/create-bdd-scenarios.md
        required_inputs: [planning/delivery-structure.md, business-intake/business-intake-summary.md, engineering-readiness/readiness-check.md]
        optional_inputs: [business-intake/business-test-expectations.md, architecture/architecture-review.md]
        outputs: [quality-gates/bdd/]
        trigger_conditions: [BDD gate triggered, quality-gates/bdd/ missing or stub]
        done_criteria: [every user story covered, scenarios have SCN-NNN IDs, Status Accepted]
      create_test_strategy:
        phase: 4-quality-gates
        prompt: skills/4-engineering-readiness/quality-gates/create-test-strategy.md
        required_inputs: [planning/delivery-structure.md, engineering-readiness/readiness-check.md]
        optional_inputs: [quality-gates/bdd/, architecture/architecture-rules.md]
        outputs: [quality-gates/test-strategy.md]
        trigger_conditions: [test strategy gate triggered, quality-gates/test-strategy.md missing]
        done_criteria: [test approach defined, coverage levels stated, Status Accepted]
      generate_test_stubs_from_bdd:
        phase: 8-implementation
        prompt: skills/8-copilot-implementation/03-generate-test-stubs-from-bdd.md
        required_inputs: [quality-gates/bdd/, engineering-readiness/initiative-context.md]
        optional_inputs: [quality-gates/test-strategy.md]
        outputs: [test stubs in target repo]
        trigger_conditions: [quality-gates/bdd/acceptance-checklist.md has Status Accepted, engineer requests test stubs]
        done_criteria: [one failing test stub per BDD scenario]
      review_qa:
        phase: 9-review
        prompt: skills/9-reviewers/02-qa-review.md
        required_inputs: [implementation artifacts]
        optional_inputs: [quality-gates/bdd/, quality-gates/test-strategy.md, planning/delivery-structure.md]
        outputs: [QA review findings]
        trigger_conditions: [implementation complete, QA coverage review needed]
        done_criteria: [coverage assessed, regression risks identified, finding IDs assigned]

  security-reviewer:
    display_name: Security Reviewer
    mission: Reviews security, privacy, PII handling, compliance, threat model, access control, and data exposure risks.
    skills:
      create_security_review:
        phase: 4-quality-gates
        prompt: skills/4-engineering-readiness/quality-gates/create-security-review.md
        required_inputs: [business-intake/business-intake-summary.md, architecture/architecture-review.md, engineering-readiness/readiness-check.md]
        optional_inputs: [architecture/architecture-rules.md, engineering-readiness/initiative-context.md]
        outputs: [quality-gates/security-review.md]
        trigger_conditions: [PII risk, auth risk, authorization risk, secrets exposure risk, security gate triggered]
        done_criteria: [OWASP risks assessed, auth model explicit, PII handling documented, Status Accepted]
      create_threat_model:
        phase: 4-quality-gates
        prompt: skills/4-engineering-readiness/quality-gates/create-threat-model.md
        required_inputs: [quality-gates/security-review.md, architecture/architecture-review.md]
        optional_inputs: [engineering-readiness/initiative-context.md]
        outputs: [quality-gates/threat-model.md]
        trigger_conditions: [high-risk security boundary identified, threat model gate triggered]
        done_criteria: [STRIDE threats assessed, mitigations recorded, Status Accepted]
      create_data_contract:
        phase: 4-quality-gates
        prompt: skills/4-engineering-readiness/quality-gates/create-data-contract.md
        required_inputs: [business-intake/business-intake-summary.md, architecture/architecture-review.md]
        optional_inputs: [quality-gates/security-review.md]
        outputs: [quality-gates/data-contract.md]
        trigger_conditions: [data ownership change, schema change, PII change, residency change, data contract gate triggered]
        done_criteria: [data ownership explicit, PII fields identified, retention documented, Status Accepted]
      review_security:
        phase: 9-review
        prompt: skills/9-reviewers/04-security-review.md
        required_inputs: [implementation artifacts]
        optional_inputs: [quality-gates/security-review.md, quality-gates/threat-model.md, architecture/architecture-rules.md]
        outputs: [security review findings]
        trigger_conditions: [implementation touches security or PII boundary]
        done_criteria: [OWASP risks assessed, auth and PII handling verified, finding IDs assigned]

  engineering-lead:
    display_name: Engineering Lead
    mission: Creates implementation-ready handoff packages and guides one-task-at-a-time implementation.
    skills:
      check_engineering_readiness:
        phase: 4-engineering-readiness
        prompt: skills/4-engineering-readiness/01-check-engineering-readiness.md
        required_inputs: [architecture/architecture-review.md, architecture/architecture-rules.md, state/open-decisions.md, planning/delivery-structure.md]
        optional_inputs: [architecture/existing-system-impact.md]
        outputs: [engineering-readiness/readiness-check.md]
        trigger_conditions: [engineering-readiness/readiness-check.md missing, architecture review and rules exist]
        done_criteria: [explicit Ready or Not ready decision, every triggered gate listed, no placeholder owners]
      generate_initiative_context:
        phase: 4-engineering-readiness
        prompt: skills/4-engineering-readiness/02-generate-initiative-context.md
        required_inputs: [engineering-readiness/readiness-check.md, architecture/architecture-rules.md, architecture/architecture-review.md]
        optional_inputs: [input/architecture.md, planning/delivery-structure.md]
        outputs: [engineering-readiness/initiative-context.md]
        trigger_conditions: [engineering-readiness/initiative-context.md missing or has empty rows, readiness Ready]
        done_criteria: [technology constraints, binding rules, governed boundaries populated, no empty rows]
      create_openspec_handoff:
        phase: 5-handoff
        prompt: skills/5-handoff/01-create-openspec-change-for-active-deliverable.md
        required_inputs: [engineering-readiness/readiness-check.md, engineering-readiness/initiative-context.md, planning/delivery-structure.md]
        optional_inputs: [input/repositories/, planning/traceability-matrix.md, quality-gates/*.md]
        outputs: [specs/dependency-graph.md, specs/<story-folders>/]
        trigger_conditions: [readiness complete, OpenSpec mode, all triggered gates Accepted]
        done_criteria: [dependency-graph.md wave-ordered, every story folder has proposal design and tasks]
      create_standalone_handoff:
        phase: 5-handoff
        prompt: skills/5-handoff/02-create-standalone-delivery-package.md
        required_inputs: [engineering-readiness/readiness-check.md, engineering-readiness/initiative-context.md, planning/delivery-structure.md]
        optional_inputs: [planning/traceability-matrix.md]
        outputs: [standalone-delivery/<deliverable-name>/]
        trigger_conditions: [readiness complete, Standalone mode, all triggered gates Accepted]
        done_criteria: [delivery spec, tasks, and validation plan present, all tasks traceable]
      create_compact_handoff:
        phase: 5-handoff
        prompt: skills/5-handoff/03-create-compact-handoff-package.md
        required_inputs: [state/routing-decision.md, input/brs.md]
        optional_inputs: [engineering-readiness/readiness-check.md, business-intake/business-intake-summary.md]
        outputs: [compact handoff artifact]
        trigger_conditions: [small change, Fast Path routing confirmed]
        done_criteria: [scope, tasks, and constraints in single artifact, traceable to BRS]
      implement_one_task:
        phase: 8-implementation
        prompt: skills/8-copilot-implementation/01-implement-one-task.md
        required_inputs: [engineering-readiness/initiative-context.md, approved task from handoff package]
        optional_inputs: [quality-gates/bdd/]
        outputs: [code changes, implementation summary]
        trigger_conditions: [approved implementation task selected]
        done_criteria: [task implemented, implementation summary produced, BDD scenarios referenced]
      fix_review_comments:
        phase: 8-implementation
        prompt: skills/8-copilot-implementation/02-fix-review-comments.md
        required_inputs: [review findings, implementation artifacts, engineering-readiness/initiative-context.md]
        optional_inputs: [quality-gates/bdd/]
        outputs: [code changes, fix summary]
        trigger_conditions: [review findings returned requiring fixes]
        done_criteria: [all required-fix findings addressed, fix summary produced]

  reviewer:
    display_name: Reviewer
    mission: Reviews implementation against requirements, architecture rules, security expectations, and traceability.
    skills:
      senior_code_review:
        phase: 9-review
        prompt: skills/9-reviewers/01-senior-code-review.md
        required_inputs: [implementation artifacts, engineering-readiness/initiative-context.md]
        optional_inputs: [quality-gates/bdd/, architecture/architecture-rules.md]
        outputs: [review findings with Finding IDs]
        trigger_conditions: [implementation complete]
        done_criteria: [all findings have IDs, required-fix vs optional distinguished]
      architecture_review:
        phase: 9-review
        prompt: skills/9-reviewers/03-architecture-review.md
        required_inputs: [implementation artifacts, architecture/architecture-rules.md, architecture/architecture-review.md]
        optional_inputs: [engineering-readiness/initiative-context.md]
        outputs: [architecture review findings]
        trigger_conditions: [implementation touches architecture boundary]
        done_criteria: [architecture rule compliance assessed, finding IDs assigned]
      spec_correction:
        phase: 9-review
        prompt: skills/9-reviewers/05-spec-correction.md
        required_inputs: [affected spec artifact, review finding referencing defect]
        optional_inputs: [input/brs.md, business-intake/business-intake-summary.md]
        outputs: [corrected spec artifact]
        trigger_conditions: [implementation reveals spec is wrong or ambiguous]
        done_criteria: [spec defect corrected, change noted with rationale, traceability preserved]
